# Plafonds de ressources (VPS mutualise 8 vCPU / 24 Go) : voir CAPACITY.md dans
# le depot Infrastructure. Site statique servi par nginx : tres peu de memoire.
services:
  app:
    image: zstin4/web-portfolio:${IMAGE_TAG}
    container_name: portfolio-web
    restart: always
    environment:
      # Injecte la valeur du .env dans le container. L'entrypoint la lira
      # pour generer /version.js au demarrage.
      IMAGE_TAG: ${IMAGE_TAG}
    expose:
      - "80"
    mem_limit: 192m
    cpus: 1
    cpu_shares: 1024
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

  # Exporter Prometheus du nginx du site (stub_status sur le port interne
  # 8080, voir nginx.conf). Nom de conteneur attendu par prometheus.yml
  # (dépôt Infrastructure, job « nginx »).
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: nginx-exporter-portfolio-web
    restart: always
    command:
      - --nginx.scrape-uri=http://portfolio-web:8080/nginx_status
    expose:
      - "9113"
    depends_on:
      - app
    mem_limit: 32m
    cpus: 0.1
    cpu_shares: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

networks:
  web:
    external: true
    name: web
