# Port interne des métriques : lu par l'exporter nginx de ce compose
# (nginx-exporter-portfolio-web), jamais publié ni routé par le proxy du VPS.
# Avant, le site n'avait aucune métrique : seule la sonde blackbox disait
# s'il répondait, pas combien de requêtes ni de connexions.
server {
    listen 8080;
    server_tokens off;
    access_log off;

    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/xml application/rss+xml
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — required for react-router routes (/projets/:slug, /parcours, …)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed static assets — cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML — never cache (so deploys propagate immediately)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # version.js — generated at container startup, never cache
    location = /version.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # PWA — service worker MUST not be cached (scope-control)
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type "application/manifest+json";
    }

    # PWA icons — cacheable
    location /icons/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # robots / favicon
    location = /robots.txt  { access_log off; log_not_found off; }
    location = /favicon.ico { access_log off; log_not_found off; }
}
