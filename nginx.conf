server {
    listen 80;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/xml application/rss+xml
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — required for react-router routes (/projets/:slug, /parcours, …)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed static assets — cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML — never cache (so deploys propagate immediately)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # version.js — generated at container startup, never cache
    location = /version.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # PWA — service worker MUST not be cached (scope-control)
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type "application/manifest+json";
    }

    # PWA icons — cacheable
    location /icons/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # robots / favicon
    location = /robots.txt  { access_log off; log_not_found off; }
    location = /favicon.ico { access_log off; log_not_found off; }
}
